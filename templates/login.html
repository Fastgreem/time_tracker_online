<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему учета времени</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e1e1e6;
            --text-secondary: #8d8d99;
            --primary-color: #00b37e;
            --primary-hover: #00875f;
            --error-color: #f75a68;
            --border-color: #29292e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 420px; padding: 40px 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .login-card h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
        .login-card p { color: var(--text-secondary); font-size: 14px; text-align: center; margin-bottom: 24px; }
        
        .error-box { background-color: rgba(247, 90, 104, 0.1); border-left: 4px solid var(--error-color); color: var(--error-color); padding: 12px; border-radius: 4px; font-size: 14px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--text-color); }
        .form-group input { width: 100%; background-color: #121214; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px 16px; color: #fff; font-size: 15px; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--primary-color); }
        
        .btn-submit { width: 100%; background-color: var(--primary-color); border: none; border-radius: 6px; padding: 14px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Электронный Табель</h2>
        <p>Введите ваши данные для доступа к системе</p>
        
        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">ФИО сотрудника</label>
                <input type="text" id="username" name="username" placeholder="Иванов И.И." required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-submit">Войти в кабинет</button>
        </form>
    </div>
</body>
</html>
