<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Табель</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body>
    <div style="max-width: 400px; margin: 50px auto; text-align: center;">
        <h2>Авторизация</h2>
        
        {% if error %}
            <blockquote style="color: #ff5555; border-color: #ff5555;">{{ error }}</blockquote>
        {% endif %}

        <form action="/login" method="post">
            <label for="username">ФИО сотрудника:</label>
            <input type="text" id="username" name="username" placeholder="Иванов И.И." required>
            
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            
            <button type="submit" style="width: 100%; margin-top: 15px;">Войти</button>
        </form>
    </div>
</body>
</html>
